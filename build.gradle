plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
//	id 'io.github.juuxel.loom-quiltflower' version '1.7.1'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = "Sleeping Town"
		url 'https://repo.sleeping.town'
		// just lib39 and kaleido
		content {
			includeGroup 'com.unascribed'
			includeGroup 'folk.sisby'
		}
	}
	maven {
		name = "maven.gegy.dev"
		url = "https://maven.gegy.dev"
	}
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		// Fractal
		name = ".is-immensely.gay"
		url = "https://maven.is-immensely.gay/releases"
	}
	maven {
		// "Basic Math"
		url = "https://maven.shedaniel.me/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/arcana.accesswidener")

	runs {
		datagen {
			client()
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.modid=arcana"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
		}

		clientCompat {
			inherit client
			configName = "Minecraft Client w/ Compat"
			runDir = "run-compat"
		}
	}
}

runClient {
	args "-Dgeckolib.disable_examples=true"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "dev.emi:emi-fabric:${emi_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"
	modImplementation "com.terraformersmc:biolith-fabric:${biolith_version}"

	// TODO: split up after unilib39 is published
	// TODO: include properly
	modApi project(path: ":Lib39", configuration: "namedElements")
	modApi include("dev.emi:trinkets:${trinkets_version}"){
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	implementation include("folk.sisby:kaleido-config:${kaleido_version}")
	modImplementation include("de.dafuqs:fractal:${project.fractal_version}")

	for(String cc_module : ["base", "world", "entity", "chunk"])
		modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-${cc_module}:${cardinal_comp_version}"){
			exclude(group: "net.fabricmc.fabric-api")
			exclude(group: "net.fabricmc", module: "fabric-loader")
		}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"lib39_version": lib39_version,
				"trinkets_version": trinkets_version,
				"cc_version": cardinal_comp_version,
				"biolith_version": biolith_version,
				"geckolib_version": geckolib_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs.addAll("-Xmaxerrs", "1000")
}

tasks.withType(ProcessResources).configureEach {
	filesMatching("**/*.json") {
		it.filter {
			it.strip().startsWith("//") ? null : it
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(21)
	targetCompatibility = JavaVersion.toVersion(21)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}